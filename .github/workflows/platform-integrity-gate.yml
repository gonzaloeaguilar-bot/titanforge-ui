name: Platform Integrity Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  platform-integrity-gate:
    name: platform-integrity-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify UI & attribution integrity + build
        run: npm run build
